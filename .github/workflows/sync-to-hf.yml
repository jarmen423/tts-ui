name: Deploy to Hugging Face Space (gubernac/tts-anything-byok)

# This workflow keeps the HF Space in sync with pushes to the deploy/hf-spaces branch.
# The HF Space (gubernac/tts-anything-byok) is configured as a Docker Space.
#
# On every push to deploy/hf-spaces (or manual trigger), files are mirrored to the Space.
# The Space then automatically rebuilds using the Dockerfile.

on:
  push:
    branches:
      - deploy/hf-spaces
  workflow_dispatch:   # Allows manual "Run workflow" button in GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history (useful if you ever switch to git-push method)
          lfs: true        # in case you add large model files later

      - name: Sync to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          # Your GitHub repo (inferred automatically)
          github_repo_id: ${{ github.repository }}

          # Target HF Space — change this if you ever move the Space
          huggingface_repo_id: gubernac/tts-anything-byok

          # HF token with write access (add as GitHub secret)
          hf_token: ${{ secrets.HF_TOKEN }}

          # Optional: you can force a specific commit message visible on the HF repo
          # commit_message: "Deploy from GitHub ${{ github.sha }}"
