name: Deploy to Hugging Face Space (gubernac/tts-anything-byok)

# This workflow keeps the HF Space in sync with pushes to the deploy/hf-spaces branch.
# The HF Space (gubernac/tts-anything-byok) is configured as a Docker Space.
#
# On every push to deploy/hf-spaces (or manual trigger via "Run workflow"), 
# the full repo is pushed to the HF Space. The Space then automatically rebuilds the Docker image.

on:
  push:
    branches:
      - deploy/hf-spaces
  workflow_dispatch:   # Allows manual "Run workflow" button in GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure git for HF push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Deploying commit: $(git rev-parse --short HEAD) from branch ${{ github.ref }}"

      - name: Bust Docker build cache (force new image layers)
        # HF Docker Spaces sometimes cache too aggressively. Touching the Dockerfile
        # with a unique timestamp guarantees the build context changes and forces
        # a real rebuild instead of reusing old image layers.
        run: |
          echo "" >> Dockerfile
          echo "# Rebuild trigger: $(date -u +%Y-%m-%dT%H:%M:%SZ) - commit ${{ github.sha }}" >> Dockerfile
          echo "Dockerfile updated with rebuild marker to force fresh build"

      - name: Push to Hugging Face Space (direct git)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Pushing to HF Space gubernac/tts-anything-byok..."
          git push https://gubernac:${HF_TOKEN}@huggingface.co/spaces/gubernac/tts-anything-byok HEAD:main --force
          echo "Push completed."

      - name: Force restart the Space (ensures Docker rebuild)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Forcing restart of gubernac/tts-anything-byok to trigger Docker rebuild..."
          # Note: Normal restart sometimes isn't aggressive enough with HF's Docker cache.
          # The Dockerfile timestamp above + this restart is usually sufficient.
          # For a one-time full clean rebuild, use "Factory reboot" from the Space UI.
          curl -sS -X POST \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            https://huggingface.co/api/spaces/gubernac/tts-anything-byok/restart
          echo ""
          echo "✅ Restart requested. The Space should now be building the new image."

      - name: Summary
        run: |
          echo "✅ Deployment triggered for gubernac/tts-anything-byok"
          echo "Check build progress at: https://huggingface.co/spaces/gubernac/tts-anything-byok"
